<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Order Ready — Sarah Shop</title>
<link rel="icon" href="sarah-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.portal{width:min(94%,980px);margin:50px auto 90px;position:relative}
.portal-card{overflow:hidden;border-radius:30px;position:relative}
.portal-banner{height:300px;position:relative;overflow:hidden}.portal-banner img{width:100%;height:100%;object-fit:cover}.portal-banner:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 20%,#07111c 95%)}
.portal-body{padding:30px;text-align:center}
.portal-badge{display:inline-flex;padding:8px 11px;border-radius:999px;border:1px solid rgba(105,236,255,.18);background:rgba(105,236,255,.05);color:var(--cyan);font-size:8px;font-weight:900;letter-spacing:1px}
.portal-body h1{font-size:clamp(30px,5vw,50px);margin-top:14px}.portal-body p{max-width:620px;margin:8px auto 0;color:#7c91a5;font-size:11px;line-height:1.75}
.receipt{margin:25px auto 0;max-width:650px;text-align:left;padding:10px 18px;border:1px solid var(--line);border-radius:17px;background:#06101a}
.r{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid rgba(117,204,255,.08)}.r:last-child{border:0}.r span{color:#54718a;font-size:8px;font-weight:900}.r b{font-size:10px}.copy{padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:#091522;color:#9db2c3;font-size:8px;font-weight:900;cursor:pointer}
.portal-actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:22px}
.orbit{position:absolute;border:1px solid rgba(105,236,255,.13);border-radius:50%;pointer-events:none}.o1{width:200px;height:200px;right:-70px;top:120px;animation:spin 14s linear infinite}.o2{width:120px;height:120px;left:-40px;bottom:40px;animation:spin 9s linear reverse infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:560px){.portal-body{padding:24px 16px}.r{grid-template-columns:85px 1fr}.copy{grid-column:2;justify-self:start}.portal-banner{height:220px}}

.portal:before{
  content:"";position:absolute;left:50%;top:58%;width:520px;height:180px;border-radius:50%;
  transform:translate(-50%,-50%) rotateX(72deg);
  border:1px solid rgba(105,236,255,.10);box-shadow:0 0 55px rgba(20,120,255,.06);pointer-events:none
}
.portal-card{isolation:isolate}
.portal-card:before{
  content:"";position:absolute;inset:-50% -20%;z-index:3;pointer-events:none;
  background:linear-gradient(115deg,transparent 42%,rgba(105,236,255,.06) 50%,transparent 58%);
  animation:holoPass 7s linear infinite
}
@keyframes holoPass{from{transform:translateX(-35%) rotate(7deg)}to{transform:translateX(35%) rotate(7deg)}}
</style>
</head>
<body><div class="aurora"></div>
<nav class="site-nav wrap glass"><a class="brand" href="index.html"><img src="sarah-logo.png"><div><strong>SARAH SHOP</strong><small>ORDER HANDOFF</small></div></a><div class="nav-actions"><a class="btn" href="index.html">← Store</a><a class="btn primary" href="https://discord.gg/rAQcaKJSF8" target="_blank">Discord</a></div></nav>
<main class="portal scene">
  <div class="orbit o1"></div><div class="orbit o2"></div>
  <section class="portal-card glass tilt holo depth-shadow reveal">
    <div class="portal-banner"><img src="sarah-banner.png"></div>
    <div class="portal-body depth-1">
      <div class="portal-badge">ORDER READY</div>
      <h1>CONTINUE IN DISCORD.</h1>
      <p>Your order details are ready. Open a Purchase Ticket and provide your Order ID so staff can confirm the final order, payment, and delivery.</p>
      <div class="receipt">
        <div class="r"><span>ORDER ID</span><b id="o">—</b><button class="copy" data-copy="o">COPY</button></div>
        <div class="r"><span>PRODUCT</span><b id="p">—</b></div>
        <div class="r"><span>OPTION</span><b id="op">—</b></div>
        <div class="r"><span>TOTAL</span><b id="u">—</b></div>
      </div>
      <div class="portal-actions"><a class="btn primary" href="https://discord.gg/rAQcaKJSF8" target="_blank">Open Purchase Ticket →</a><a class="btn" href="index.html">Back to Store</a></div>
    </div>
  </section>
</main>
<script src="ui.js"></script>
<script>
const q=new URLSearchParams(location.search);o.textContent=q.get("order")||"Unknown";p.textContent=q.get("product")||"Unknown";op.textContent=q.get("option")||"Unknown";u.textContent=q.get("usd")?"$"+q.get("usd"):"Unknown";
document.querySelectorAll("[data-copy]").forEach(btn=>btn.onclick=async()=>{try{await navigator.clipboard.writeText(document.getElementById(btn.dataset.copy).textContent);btn.textContent="COPIED ✓";setTimeout(()=>btn.textContent="COPY",1200)}catch(e){btn.textContent="SELECT"}})
</script>
</body></html>

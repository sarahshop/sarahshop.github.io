<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sarah Shop — Litecoin Checkout</title><link rel="icon" href="sarah-logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet"><style>
:root{--bg:#02040a;--p:#07111c;--p2:#0a1625;--c:#72eaff;--b:#0568ff;--w:#f7fbff;--m:#768ba0;--l:rgba(83,198,255,.15)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,rgba(0,183,255,.14),transparent 28%),linear-gradient(#02040a,#030812 55%,#02040a);color:var(--w);font-family:Manrope,sans-serif}a{color:inherit}.wrap{width:min(94%,1500px);margin:auto}.grid{position:fixed;inset:0;z-index:-1;background-image:linear-gradient(rgba(61,183,255,.024) 1px,transparent 1px),linear-gradient(90deg,rgba(61,183,255,.024) 1px,transparent 1px);background-size:48px 48px}.nav{width:min(94%,1500px);margin:16px auto;padding:14px 16px;border:1px solid var(--l);border-radius:20px;background:rgba(4,10,18,.88);display:flex;justify-content:space-between;align-items:center;position:sticky;top:12px;z-index:5}.brand{display:flex;gap:12px;align-items:center;text-decoration:none}.brand img{width:46px;height:46px;border-radius:14px}.brand b{font-family:Orbitron}.small{font-size:8px;color:#61768a;letter-spacing:1.3px}.btn{padding:11px 14px;border-radius:10px;text-decoration:none;border:1px solid var(--l);background:#091522;color:#9eb0c2;font-size:11px;font-weight:800}.btn.primary{background:linear-gradient(135deg,var(--c),var(--b));color:#001018;border:none}.banner{overflow:hidden;border:1px solid var(--l);border-radius:28px}.banner img{width:100%;height:auto;display:block}.hero{margin-top:16px;padding:28px;border:1px solid var(--l);border-radius:22px;background:linear-gradient(145deg,#091522,#05101a)}h1{font-family:Orbitron;font-size:clamp(38px,5vw,68px);line-height:.92;margin:0}.accent{color:var(--c)}.hero p{color:var(--m);font-size:12px;line-height:1.7;max-width:760px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:70px 0 18px}.tab{padding:10px 14px;border-radius:999px;border:1px solid var(--l);background:#07111c;color:#6e8499;font-weight:800;cursor:pointer}.tab.active,.tab:hover{background:linear-gradient(135deg,var(--c),var(--b));color:#001018}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding-bottom:90px}.product{border:1px solid var(--l);border-radius:18px;background:linear-gradient(145deg,#091522,#05101a);padding:18px}.product small{color:#4f718e;font-weight:800;font-size:7px}.product h3{margin:14px 0}.rows{display:grid;gap:8px}.row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;border:1px solid rgba(83,198,255,.09);background:#06101a;color:#7d91a5;font-size:10px}.row b{color:var(--c)}.buy{padding:7px 10px;border-radius:8px;text-decoration:none;background:rgba(0,183,255,.1);color:var(--c);border:1px solid rgba(0,183,255,.18);font-weight:800}.hidden{display:none}@media(max-width:900px){.products{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.products{grid-template-columns:1fr}.small{display:none}}
</style></head><body><div class="grid"></div><nav class="nav"><a class="brand" href="index.html"><img src="sarah-logo.png"><div><b>SARAH SHOP</b><div class="small">LITECOIN CHECKOUT</div></div></a><div><a class="btn" href="tos.html">Terms</a> <a class="btn primary" target="_blank" href="https://discord.gg/AEdJtcKwVB">Discord</a></div></nav><main class="wrap"><div class="banner"><img src="sarah-banner.png"></div><section class="hero"><h1>SHOP. PAY. <span class="accent">DONE.</span></h1><p>Choose an option below and pay with Litecoin. After sending payment, keep your order ID and transaction ID (TXID), then open a Discord purchase ticket.</p></section><div class="tabs"><button class="tab active" data-cat="all">All</button><button class="tab" data-cat="streaming">Streaming</button><button class="tab" data-cat="ai">AI</button><button class="tab" data-cat="discord">Discord</button><button class="tab" data-cat="social">Social</button><button class="tab" data-cat="gaming">Gaming</button></div><div id="products" class="products"></div></main><script src="products.js"></script><script>
const root=document.getElementById('products'),groups={};for(const p of SARAH_PRODUCTS){const k=p.cat+'|'+p.name;(groups[k]??=[]).push(p)}for(const [k,items] of Object.entries(groups)){const [cat,name]=k.split('|');const card=document.createElement('section');card.className='product';card.dataset.cat=cat;card.innerHTML=`<small>${cat.toUpperCase()}</small><h3>${name}</h3><div class="rows"></div>`;for(const p of items){const r=document.createElement('div');r.className='row';r.innerHTML=`<span>${p.option}</span><b>$${p.price}</b><a class="buy" href="checkout.html?id=${encodeURIComponent(p.id)}">Buy</a>`;card.querySelector('.rows').appendChild(r)}root.appendChild(card)}document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');document.querySelectorAll('.product').forEach(c=>c.classList.toggle('hidden',t.dataset.cat!=='all'&&c.dataset.cat!==t.dataset.cat))});
</script></body></html>
